<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #333; }
      .subtitle { font: bold 18px sans-serif; fill: #555; }
      .text { font: 14px sans-serif; fill: #666; }
      .small-text { font: 12px sans-serif; fill: #777; }
      .rest-box { fill: #ff6b6b; stroke: #c92a2a; stroke-width: 2; }
      .graphql-box { fill: #51cf66; stroke: #2f9e44; stroke-width: 2; }
      .endpoint-box { fill: #fff; stroke: #adb5bd; stroke-width: 2; }
      .arrow { fill: none; stroke: #495057; stroke-width: 2; marker-end: url(#arrowhead); }
      .label-bg { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">GraphQL vs REST: Architecture Comparison</text>
  
  <!-- REST Section -->
  <g id="rest-section">
    <text x="300" y="80" text-anchor="middle" class="subtitle">REST API - Multiple Endpoints</text>
    
    <!-- Client -->
    <rect x="50" y="100" width="100" height="60" rx="5" class="endpoint-box"/>
    <text x="100" y="135" text-anchor="middle" class="text">Client</text>
    
    <!-- Request 1: Users -->
    <path d="M 150 120 L 220 160" class="arrow"/>
    <rect x="210" y="110" width="90" height="25" rx="3" class="label-bg"/>
    <text x="255" y="127" text-anchor="middle" class="small-text">GET /users/1</text>
    
    <rect x="320" y="140" width="120" height="60" rx="5" class="endpoint-box"/>
    <text x="380" y="175" text-anchor="middle" class="text">/users/:id</text>
    
    <rect x="460" y="140" width="180" height="60" rx="5" class="rest-box"/>
    <text x="550" y="165" text-anchor="middle" class="small-text">{ id, name, email,</text>
    <text x="550" y="182" text-anchor="middle" class="small-text">bio, age, address... }</text>
    <text x="550" y="195" text-anchor="middle" class="small-text" font-weight="bold">ALL fields returned</text>
    
    <!-- Request 2: Posts -->
    <path d="M 150 130 L 220 250" class="arrow"/>
    <rect x="200" y="230" width="110" height="25" rx="3" class="label-bg"/>
    <text x="255" y="247" text-anchor="middle" class="small-text">GET /users/1/posts</text>
    
    <rect x="320" y="230" width="120" height="60" rx="5" class="endpoint-box"/>
    <text x="380" y="265" text-anchor="middle" class="text">/users/:id/posts</text>
    
    <rect x="460" y="230" width="180" height="60" rx="5" class="rest-box"/>
    <text x="550" y="255" text-anchor="middle" class="small-text">[{ id, title, content,</text>
    <text x="550" y="272" text-anchor="middle" class="small-text">created_at, updated_at... }]</text>
    <text x="550" y="285" text-anchor="middle" class="small-text" font-weight="bold">Unwanted data</text>
    
    <!-- Request 3: Comments -->
    <path d="M 150 140 L 220 340" class="arrow"/>
    <rect x="185" y="330" width="140" height="25" rx="3" class="label-bg"/>
    <text x="255" y="347" text-anchor="middle" class="small-text">GET /posts/1/comments</text>
    
    <rect x="320" y="320" width="120" height="60" rx="5" class="endpoint-box"/>
    <text x="380" y="355" text-anchor="middle" class="text">/posts/:id/comments</text>
    
    <rect x="460" y="320" width="180" height="60" rx="5" class="rest-box"/>
    <text x="550" y="345" text-anchor="middle" class="small-text">[{ id, content, author,</text>
    <text x="550" y="362" text-anchor="middle" class="small-text">created_at, likes... }]</text>
    <text x="550" y="375" text-anchor="middle" class="small-text" font-weight="bold">Over-fetching</text>
    
    <!-- Problems label -->
    <rect x="50" y="420" width="590" height="120" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="345" y="445" text-anchor="middle" font-weight="bold" fill="#e65100" font-size="16">❌ REST API Problems:</text>
    <text x="70" y="470" class="text">• Multiple network requests needed (3 requests in this example)</text>
    <text x="70" y="495" class="text">• Over-fetching: Getting unnecessary data (bio, age, address, etc.)</text>
    <text x="70" y="520" class="text">• Under-fetching: Need multiple round trips to get related data</text>
  </g>
  
  <!-- GraphQL Section -->
  <g id="graphql-section">
    <text x="900" y="80" text-anchor="middle" class="subtitle">GraphQL - Single Endpoint</text>
    
    <!-- Client -->
    <rect x="700" y="100" width="100" height="60" rx="5" class="endpoint-box"/>
    <text x="750" y="135" text-anchor="middle" class="text">Client</text>
    
    <!-- Single Request -->
    <path d="M 800 130 L 870 220" class="arrow"/>
    <rect x="810" y="170" width="120" height="40" rx="3" class="label-bg"/>
    <text x="870" y="187" text-anchor="middle" class="small-text">POST /graphql</text>
    <text x="870" y="203" text-anchor="middle" class="small-text" font-style="italic">with query</text>
    
    <!-- GraphQL Endpoint -->
    <rect x="890" y="200" width="120" height="60" rx="5" class="endpoint-box"/>
    <text x="950" y="235" text-anchor="middle" class="text">/graphql</text>
    
    <!-- Single Response -->
    <rect x="700" y="290" width="400" height="120" rx="5" class="graphql-box"/>
    <text x="900" y="315" text-anchor="middle" class="small-text" font-weight="bold">✓ Exact data requested:</text>
    <text x="900" y="340" text-anchor="middle" font-family="monospace" font-size="11">{ user: { name, email,</text>
    <text x="900" y="360" text-anchor="middle" font-family="monospace" font-size="11">    posts: [{ title,</text>
    <text x="900" y="380" text-anchor="middle" font-family="monospace" font-size="11">      comments: [{ content }] }] } }</text>
    <text x="900" y="400" text-anchor="middle" class="small-text" font-weight="bold">Only what you need!</text>
    
    <!-- Benefits label -->
    <rect x="700" y="420" width="400" height="120" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="900" y="445" text-anchor="middle" font-weight="bold" fill="#2e7d32" font-size="16">✅ GraphQL Benefits:</text>
    <text x="720" y="470" class="text">• Single network request for all data</text>
    <text x="720" y="495" class="text">• No over-fetching: Get only requested fields</text>
    <text x="720" y="520" class="text">• No under-fetching: Get all related data at once</text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="400" y="560" width="20" height="20" class="rest-box"/>
    <text x="430" y="575" class="small-text">Over-fetched data</text>
    
    <rect x="600" y="560" width="20" height="20" class="graphql-box"/>
    <text x="630" y="575" class="small-text">Exact data needed</text>
  </g>
</svg>